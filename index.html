<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>粉もんスタンド おしん - モバイルオーダー</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <p>メニューを読み込み中...</p>
  </div>

  <header class="app-header">
    <h1>🐙 粉もんスタンド おしん</h1>
  </header>

  <nav class="category-nav" id="category-nav">
    <!-- JS injected -->
  </nav>

  <main id="app-main">
    <div id="menu-container" class="menu-grid">
      <!-- JS injected -->
    </div>
  </main>

  <footer class="cart-footer">
    <button id="view-cart-button" class="view-cart-button" disabled>
      🛒 カート <span id="cart-item-count" class="cart-badge">0</span>
    </button>
    <div class="total-price-display">
      合計: ¥<span id="cart-total-price">0</span>
    </div>
  </footer>

  <!-- Item Detail Modal -->
  <div id="item-detail-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="item-detail-name">商品名</h2>
        <button id="close-item-detail-modal" class="close-button">&times;</button>
      </div>
      <div class="modal-body">
          <img id="item-detail-img" src="" alt="" class="item-detail-img">
          <p id="item-detail-description" class="item-description"></p>
          
          <!-- Options -->
          <div class="option-section" id="section-options">
            <h3>サイズ・個数 <span class="badge badge-req">必須</span></h3>
            <div id="item-detail-options"></div>
          </div>

          <!-- Flavors -->
          <div class="option-section" id="section-flavors" style="display:none;">
            <h3>味を選ぶ <span class="badge badge-req">必須</span></h3>
            <p class="flavor-note" id="flavor-note"></p>
            <div id="item-detail-flavors"></div>
          </div>

          <!-- Toppings -->
          <div class="option-section" id="section-toppings">
            <h3>トッピング <span class="badge badge-opt">任意</span></h3>
            <div id="item-detail-toppings"></div>
          </div>

          <!-- Quantity -->
          <div class="quantity-control-area">
              <span style="font-weight:bold;">購入数量</span>
              <div class="quantity-controls">
                  <button id="item-detail-decrease" class="qty-btn">-</button>
                  <span id="item-detail-quantity" class="qty-val">1</span>
                  <button id="item-detail-increase" class="qty-btn">+</button>
              </div>
          </div>
      </div>
      <div class="modal-footer">
        <div class="modal-price-preview">
            小計: ¥<span id="item-detail-total-preview">0</span>
        </div>
        <button id="add-to-cart-button" class="submit-button">カートに追加する</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>注文確認</h2>
        <button id="close-cart-modal" class="close-button">&times;</button>
      </div>
      <div class="modal-body">
          <div id="cart-items-container"></div>
          
          <hr style="border:0; border-top:1px dashed #ddd; margin: 1.5rem 0;">

          <!-- Order Info -->
          <div class="form-group">
              <label>受取人名 <span class="badge badge-req">必須</span></label>
              <input type="text" id="recipient-name" placeholder="お名前を入力してください">
          </div>

          <div class="form-group">
            <label>受取日 <span class="badge badge-req">必須</span></label>
            <select id="pickup-date"></select>
          </div>

          <div class="form-group">
            <label>来店予定時間 <span class="badge badge-req">必須</span></label>
            <select id="pickup-time"></select>
            <small style="color:#e64a19; display:block; margin-top:5px;">※遅れる場合はご連絡ください</small>
          </div>

          <div class="form-group">
              <label>備考 <span class="badge badge-opt">任意</span></label>
              <textarea id="order-notes" rows="2" placeholder="ご要望があれば（例: 紅生姜抜きでお願いします。マヨネーズ横添えで…）"></textarea>
          </div>
      </div>

      <div class="modal-footer">
        <div class="modal-price-preview" style="text-align:center; font-size: 1.1rem; color:#333;">
          お支払い合計: <span style="font-size:1.5rem; color:var(--food-orange);">¥<span id="cart-modal-total-price">0</span></span>
        </div>
        <button id="submit-order-button" class="submit-button">注文を確定する</button>
      </div>
    </div>
  </div>

  <!-- Custom Alert -->
  <div id="custom-alert-modal" class="modal-overlay" style="align-items: center;">
    <div class="modal-content" style="height: auto; max-height: auto; border-radius: 20px; width: 90%; max-width: 350px;">
      <div class="modal-header" style="justify-content:center; border:none; padding-bottom:0;">
        <h2 id="custom-alert-title">お知らせ</h2>
      </div>
      <div class="alert-body">
          <p id="custom-alert-message" class="alert-msg"></p>
          <button id="custom-alert-ok-button" class="submit-button">OK</button>
      </div>
    </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
